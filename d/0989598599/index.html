<body>
  <main class="u-shell u-center u-stack-lg">
    <header class="brand-header">
      <a class="brand-link" href="/" aria-label="返回首頁">
        <span class="brand-logo" aria-hidden="true">
          <img src="/public/assets/images/dk_icon_white_transparent.png" alt="">
        </span>
        <span class="brand-copy">貴賓專送｜商務差旅｜旅途包車</span>
      </a>
    </header>

    <section aria-labelledby="driver-name">
      <p class="identity-role">駕駛員</p>
      <h1 class="identity-name" id="driver-name">書瑋</h1>
    </section>

    <section aria-label="聯絡方式" class="contact-section">
      <div class="u-grid u-grid-primary">
        <a class="contact-link" href="tel:+886989598599" data-contact="phone" data-country-code="886" data-value="0989598599" aria-label="撥打電話給書瑋">
          <span class="contact-label">電話</span>
        </a>

        <!-- <a class="contact-link" href="" data-contact="line" data-value="">
          <span class="contact-label">LINE</span>
        </a>

        <a class="contact-link" href="#" data-contact="wechat" data-value="" data-action="dialog">
          <span class="contact-label">WeChat</span>
        </a> -->

    </section>

    <a class="brand-footer" href="/" aria-label="返回首頁">© 2026 達克行動股份有限公司籌備處 All Rights Reserved.</a>
  </main>
  <div class="contact-dialog" data-contact-dialog hidden>
    <button class="contact-dialog__backdrop" type="button" aria-label="關閉 QR code"></button>
    <section class="contact-dialog__panel" aria-labelledby="contact-dialog-title" aria-modal="true" role="dialog">
      <button class="contact-dialog__close" type="button" aria-label="關閉">×</button>
      <h2 class="u-sr-only" id="contact-dialog-title">WeChat QR code</h2>
      <div class="contact-dialog__qr-frame">
        <img class="contact-dialog__qr-image" data-contact-dialog-image src="" alt="">
      </div>
      <div class="contact-dialog__actions">
        <button class="contact-dialog__action contact-dialog__action--copy" data-contact-dialog-copy type="button">
          <span data-contact-dialog-copy-label></span>
          <svg class="contact-dialog__copy-icon" aria-hidden="true">
            <use href="/public/assets/icons/contact-sprite.svg#icon-copy"></use>
          </svg>
          <span class="contact-dialog__action-tip" data-contact-dialog-copy-tip>已複製</span>
        </button>
        <a class="contact-dialog__action is-link" data-contact-dialog-download href="" download>下載圖片</a>
      </div>
    </section>
  </div>
  <script src="/js/driver-contact.js"></script>
